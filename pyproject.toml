[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-factory"
version = "0.1.0"
description = "Manifest-driven factory for configuring specialist agents."
requires-python = ">=3.11"
dependencies = [
    "langmem>=0.0.30",
    "watchfiles>=1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
]
langchain = [
  "deepagents>=0.1",
  "langchain[openai]>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "python-dotenv>=1.0,<2.0",
]

[project.scripts]
agent-factory = "agent_factory.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
