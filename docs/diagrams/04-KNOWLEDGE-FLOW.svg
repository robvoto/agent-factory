<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge Flow</title>
  <desc id="desc">Knowledge sources feed a shared store, agents read and write that store, and the Knowledge Keeper re-indexes and compacts it on a schedule.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .section-source { fill: #f7fbff; stroke: #8fbfe8; stroke-width: 2; }
      .section-store { fill: #f5fbf5; stroke: #8ec28e; stroke-width: 2; }
      .section-agents { fill: #fff9f0; stroke: #e0b25f; stroke-width: 2; }
      .section-keeper { fill: #fff6eb; stroke: #e09a4f; stroke-width: 2; }
      .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.8; }
      .card-title { font: 700 18px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .card-body { font: 14px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .section-title { font: 700 22px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .section-note { font: 14px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .arrow-label { font: 600 13px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .agent-list { font: 15px Inter, Segoe UI, Arial, sans-serif; fill: #1f2937; }
      .agent-head { font: 700 18px Inter, Segoe UI, Arial, sans-serif; fill: #111827; }
      .path { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1280"/>

  <rect class="section-source" x="50" y="60" width="1500" height="310" rx="26" ry="26"/>
  <text class="section-title" x="80" y="100">Knowledge Sources</text>
  <text class="section-note" x="80" y="124">Fresh inputs are ingested into the shared store as they change.</text>

  <rect class="card" x="80" y="150" width="650" height="82" rx="16" ry="16"/>
  <text class="card-title" x="110" y="178">Local docs</text>
  <text class="card-body" x="110" y="200">
    <tspan x="110" dy="0">architecture, contracts,</tspan>
    <tspan x="110" dy="18">workflows, ADRs</tspan>
  </text>

  <rect class="card" x="870" y="150" width="650" height="82" rx="16" ry="16"/>
  <text class="card-title" x="900" y="178">Trusted online sources</text>
  <text class="card-body" x="900" y="200">
    <tspan x="900" dy="0">LangChain, LangGraph,</tspan>
    <tspan x="900" dy="18">Anthropix, OpenAI docs</tspan>
  </text>

  <rect class="card" x="80" y="250" width="650" height="82" rx="16" ry="16"/>
  <text class="card-title" x="110" y="278">Agent outcomes</text>
  <text class="card-body" x="110" y="300">
    <tspan x="110" dy="0">what worked, what failed,</tspan>
    <tspan x="110" dy="18">patterns discovered</tspan>
  </text>

  <rect class="card" x="870" y="250" width="650" height="82" rx="16" ry="16"/>
  <text class="card-title" x="900" y="278">User preferences</text>
  <text class="card-body" x="900" y="300">
    <tspan x="900" dy="0">decisions made,</tspan>
    <tspan x="900" dy="18">style choices</tspan>
  </text>

  <rect class="section-store" x="50" y="410" width="1500" height="310" rx="26" ry="26"/>
  <text class="section-title" x="80" y="450">Shared Knowledge Store</text>
  <text class="section-note" x="80" y="474">`knowledge_store.sqlite3` keeps shared docs, trusted sources, and learnings.</text>

  <rect class="card" x="80" y="500" width="650" height="82" rx="16" ry="16"/>
  <text class="card-title" x="110" y="528">(shared, docs)</text>
  <text class="card-body" x="110" y="550">
    <tspan x="110" dy="0">architecture + standards</tspan>
  </text>

  <rect class="card" x="870" y="500" width="650" height="82" rx="16" ry="16"/>
  <text class="card-title" x="900" y="528">(shared, trusted)</text>
  <text class="card-body" x="900" y="550">
    <tspan x="900" dy="0">online reference docs</tspan>
  </text>

  <rect class="card" x="80" y="600" width="650" height="82" rx="16" ry="16"/>
  <text class="card-title" x="110" y="628">(agent, id, learnings)</text>
  <text class="card-body" x="110" y="650">
    <tspan x="110" dy="0">per-agent experience</tspan>
  </text>

  <rect class="card" x="870" y="600" width="650" height="82" rx="16" ry="16"/>
  <text class="card-title" x="900" y="628">(user, id, preferences)</text>
  <text class="card-body" x="900" y="650">
    <tspan x="900" dy="0">per-user preferences</tspan>
  </text>

  <rect class="section-agents" x="50" y="760" width="1500" height="210" rx="26" ry="26"/>
  <text class="section-title" x="80" y="800">All Agents</text>
  <text class="section-note" x="80" y="824">Every agent searches the store and writes decisions, outcomes, and discoveries back.</text>

  <rect class="card" x="80" y="850" width="1440" height="100" rx="18" ry="18"/>
  <text class="agent-head" x="110" y="886">Read + Write</text>
  <text class="agent-list" x="110" y="912">
    <tspan x="110" dy="0">Factory Brain - reads architecture, writes decisions</tspan>
    <tspan x="110" dy="19">Army Orchestrator - reads routing patterns, writes routing outcomes</tspan>
    <tspan x="780" y="912">AI Tech Lead - reads coding patterns, writes task outcomes</tspan>
    <tspan x="780" dy="19">Future agents - add as they join the army</tspan>
  </text>

  <rect class="section-keeper" x="470" y="1020" width="660" height="160" rx="26" ry="26"/>
  <text class="section-title" x="500" y="1060">Knowledge Keeper</text>
  <text class="section-note" x="500" y="1084">Runs on schedule to re-index, deduplicate, and compact the store.</text>

  <rect class="card" x="560" y="1110" width="480" height="64" rx="16" ry="16"/>
  <text class="card-title" x="590" y="1140">Maintenance loop</text>
  <text class="card-body" x="590" y="1162">
    <tspan x="590" dy="0">Indexes, deduplicates, and compacts on schedule</tspan>
  </text>

  <path class="path" d="M 405 232 L 405 500"/>
  <rect x="315" y="356" width="180" height="22" rx="10" ry="10" fill="#ffffff" opacity="0.92"/>
  <text class="arrow-label" x="405" y="372" text-anchor="middle">ingested on change</text>

  <path class="path" d="M 1195 232 L 1195 500"/>
  <rect x="1096" y="356" width="198" height="22" rx="10" ry="10" fill="#ffffff" opacity="0.92"/>
  <text class="arrow-label" x="1195" y="372" text-anchor="middle">crawled on schedule</text>

  <path class="path" d="M 405 332 L 405 600"/>
  <rect x="304" y="456" width="202" height="22" rx="10" ry="10" fill="#ffffff" opacity="0.92"/>
  <text class="arrow-label" x="405" y="472" text-anchor="middle">written after each task</text>

  <path class="path" d="M 1195 332 L 1195 600"/>
  <rect x="1064" y="456" width="262" height="22" rx="10" ry="10" fill="#ffffff" opacity="0.92"/>
  <text class="arrow-label" x="1195" y="472" text-anchor="middle">written during conversation</text>

  <path class="path" d="M 800 692 L 800 850"/>
  <rect x="728" y="760" width="144" height="22" rx="10" ry="10" fill="#ffffff" opacity="0.92"/>
  <text class="arrow-label" x="800" y="776" text-anchor="middle">search + write</text>

  <path class="path" d="M 800 1020 L 800 722"/>
  <rect x="618" y="868" width="364" height="22" rx="10" ry="10" fill="#ffffff" opacity="0.92"/>
  <text class="arrow-label" x="800" y="884" text-anchor="middle">re-index, deduplicate, compact</text>
</svg>
